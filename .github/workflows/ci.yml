name: CI

# Manual only. There is deliberately no `push` or `pull_request` trigger:
# a full build regenerates and compiles the whole OpenXML DOM, which is far
# too expensive to run on every commit. Start a run from the Actions tab
# ("Run workflow") or with `gh workflow run ci.yml`.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "CMake configuration used by the non-sanitizer jobs"
        type: choice
        default: Debug
        options:
          - Debug
          - RelWithDebInfo
      run_windows_msvc:
        description: "Windows / MSVC build + unit tests"
        type: boolean
        default: true
      run_linux_gcc:
        description: "Linux / GCC build + unit tests"
        type: boolean
        default: true
      run_linux_clang:
        description: "Linux / Clang build + unit tests"
        type: boolean
        default: true
      run_linux_asan:
        description: "Linux / Clang ASan + UBSan build + unit tests"
        type: boolean
        default: true
      run_windows_asan:
        description: "Windows / MSVC AddressSanitizer build + unit tests"
        type: boolean
        default: false
      run_mcp_python:
        description: "Linux / GCC MCP servers + the tests/mcp_python SDK suite"
        type: boolean
        default: true
      warnings_as_errors:
        description: "Treat warnings in hand-written code as errors"
        type: boolean
        default: true
      detect_leaks:
        description: "Enable LeakSanitizer in the ASan test run"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-msvc:
    name: Windows MSVC (${{ inputs.build_type }})
    if: inputs.run_windows_msvc
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      - name: Build and test
        shell: cmd
        env:
          CONFIGURE_PRESET: ${{ inputs.build_type == 'Debug' && 'windows-ninja-debug' || 'windows-ninja-release' }}
          BUILD_PRESET: ${{ inputs.build_type == 'Debug' && 'ninja-debug' || 'ninja-release' }}
          WARNINGS_AS_ERRORS: ${{ inputs.warnings_as_errors && 'ON' || 'OFF' }}
        run: |
          call "%GITHUB_WORKSPACE%\.github\workflows\vcvars.cmd" || exit /b 1
          cmake --preset %CONFIGURE_PRESET% -DEXYOKIOFFICE_WARNINGS_AS_ERRORS=%WARNINGS_AS_ERRORS% -DEXYOKIOFFICE_BUILD_JOBS=1 || exit /b 1
          cmake --build --preset %BUILD_PRESET% || exit /b 1
          ctest --preset %BUILD_PRESET% || exit /b 1

  windows-asan:
    name: Windows MSVC AddressSanitizer
    if: inputs.run_windows_asan
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      - name: Build and test
        shell: cmd
        env:
          WARNINGS_AS_ERRORS: ${{ inputs.warnings_as_errors && 'ON' || 'OFF' }}
        run: |
          call "%GITHUB_WORKSPACE%\.github\workflows\vcvars.cmd" || exit /b 1
          cmake --preset windows-ninja-asan -DEXYOKIOFFICE_WARNINGS_AS_ERRORS=%WARNINGS_AS_ERRORS% -DEXYOKIOFFICE_BUILD_JOBS=1 || exit /b 1
          cmake --build --preset ninja-asan || exit /b 1
          ctest --preset ninja-asan || exit /b 1

  linux-gcc:
    name: Linux GCC (${{ inputs.build_type }})
    if: inputs.run_linux_gcc
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CONFIGURE_PRESET: ${{ inputs.build_type == 'Debug' && 'linux-ninja-debug' || 'linux-ninja-release' }}
      WARNINGS_AS_ERRORS: ${{ inputs.warnings_as_errors && 'ON' || 'OFF' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++

      - name: Configure
        run: cmake --preset "$CONFIGURE_PRESET" -DEXYOKIOFFICE_WARNINGS_AS_ERRORS="$WARNINGS_AS_ERRORS"

      - name: Build
        run: cmake --build --preset "$CONFIGURE_PRESET"

      - name: Test
        run: ctest --preset "$CONFIGURE_PRESET"

  linux-clang:
    name: Linux Clang (${{ inputs.build_type }})
    if: inputs.run_linux_clang
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CONFIGURE_PRESET: ${{ inputs.build_type == 'Debug' && 'linux-ninja-clang-debug' || 'linux-ninja-clang-release' }}
      WARNINGS_AS_ERRORS: ${{ inputs.warnings_as_errors && 'ON' || 'OFF' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang

      - name: Configure
        run: cmake --preset "$CONFIGURE_PRESET" -DEXYOKIOFFICE_WARNINGS_AS_ERRORS="$WARNINGS_AS_ERRORS"

      - name: Build
        run: cmake --build --preset "$CONFIGURE_PRESET"

      - name: Test
        run: ctest --preset "$CONFIGURE_PRESET"

  linux-asan:
    name: Linux Clang ASan + UBSan
    if: inputs.run_linux_asan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      WARNINGS_AS_ERRORS: ${{ inputs.warnings_as_errors && 'ON' || 'OFF' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang llvm

      - name: Configure
        run: cmake --preset linux-ninja-asan -DEXYOKIOFFICE_WARNINGS_AS_ERRORS="$WARNINGS_AS_ERRORS"

      # The instrumented OpenXML generator runs as part of the build. Leak
      # reporting is off here so that a short-lived generator allocation cannot
      # fail the compile step; the test run below is what is being measured.
      - name: Build
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: cmake --build --preset linux-ninja-asan

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=${{ inputs.detect_leaks && '1' || '0' }}:detect_stack_use_after_return=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/workflows/lsan.supp
        run: ctest --preset linux-ninja-asan

  # The only job that installs anything from PyPI. It is the price of testing
  # the servers the way a real host reaches them: over stdio, through the
  # official MCP SDK, with nothing of ExyokiOffice linked into the client. The
  # dependency belongs to this suite alone and never to the library, the
  # servers, or a package built from them.
  mcp-python:
    name: MCP Python SDK suite
    if: inputs.run_mcp_python
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CONFIGURE_PRESET: ${{ inputs.build_type == 'Debug' && 'linux-ninja-debug' || 'linux-ninja-release' }}
      WARNINGS_AS_ERRORS: ${{ inputs.warnings_as_errors && 'ON' || 'OFF' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++

      # The runner's own Python is used deliberately: the suite asks only for
      # >= 3.10, so pinning an exact version here would test one interpreter
      # rather than the one a contributor is likely to have. It is installed
      # into a virtual environment so the dependency ranges stay in the suite's
      # pyproject.toml and nowhere else.
      - name: Prepare the test environment
        run: |
          sudo apt-get install -y python3-venv
          python3 --version
          python3 -m venv tests/mcp_python/.venv
          tests/mcp_python/.venv/bin/python -m pip install --upgrade pip
          tests/mcp_python/.venv/bin/python -m pip install -e tests/mcp_python

      # Only the servers are built. The doctest layers are the other jobs' work,
      # and building them here would double a long compile for nothing.
      - name: Configure
        run: >
          cmake --preset "$CONFIGURE_PRESET"
          -DEXYOKIOFFICE_WARNINGS_AS_ERRORS="$WARNINGS_AS_ERRORS"
          -DEXYOKIOFFICE_BUILD_UNIT_TESTS=OFF
          -DEXYOKIOFFICE_BUILD_MCP_PYTHON_TESTS=ON
          -DEXYOKIOFFICE_MCP_PYTHON="${{ github.workspace }}/tests/mcp_python/.venv/bin/python"

      - name: Build
        run: cmake --build --preset "$CONFIGURE_PRESET" --target exyoki-mcp-word exyoki-mcp-excel exyoki-mcp-power-point

      # --output-on-failure: pytest's own report is the diagnosis, and CTest
      # hides the output of a passing entry. --no-tests=error: a label that
      # matches nothing is a pass by default, so a job that registered no entry
      # would go green having run nothing at all.
      - name: Test
        run: ctest --preset "$CONFIGURE_PRESET" -L mcp-python --output-on-failure --no-tests=error
